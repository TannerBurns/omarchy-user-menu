name: CI

# Pull requests into main, and merges (pushes) to main. Nothing else.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Plugin checks and probe tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          bash --version | head -n1
          jq --version
          python3 --version
          shellcheck --version | sed -n 2p

      - name: Run tests
        # Manifest/icon/version checks, shellcheck, and the probe suite (fixtures
        # for every provider, fake tokens generated at runtime, redaction guard,
        # side-effect and timeout tests).
        run: bash tests/run.sh
